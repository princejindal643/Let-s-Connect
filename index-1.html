.spark{position:absolute;top:2.4%;right:6.5%;width:38px;height:150px}
.spark svg{display:block;width:100%;height:100%}
#app{position:relative;flex:1;display:flex;flex-direction:column;padding:clamp(150px,31svh,290px) 12% clamp(70px,11svh,120px)}
.head{border-left:1px solid var(--line);padding:4px 0 6px 7%;margin-left:0}
h1{margin:0;font-family:"Cormorant Garamond",Garamond,Georgia,serif;font-weight:500;font-size:clamp(54px,15.5vw,78px);line-height:1.05;letter-spacing:-.01em}
.tag{margin:8px 0 0;font-family:"Cormorant Garamond",Garamond,Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(19px,5.4vw,25px);line-height:1.3}
.rule{width:23%;height:1px;background:var(--line);margin:clamp(24px,4.5svh,40px) 0 clamp(26px,4.5svh,40px)}
.cards{display:flex;flex-direction:column;gap:clamp(14px,2.2svh,20px)}
.card{display:flex;align-items:center;min-height:72px;padding:0 22px 0 14px;border:1px solid var(--line);border-radius:24px;background:rgba(255,250,240,.18);color:inherit;text-decoration:none;transition:border-color .2s,background .2s}
.card:hover{border-color:var(--ink);background:rgba(255,250,240,.35)}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.ic{flex:none;width:50px;display:grid;place-items:center}
.ic svg{width:28px;height:28px;fill:var(--ink);stroke:none}
.ic svg.st{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dv{flex:none;width:1px;height:38px;background:var(--line);margin:0 18px 0 8px}
.t{flex:1;font-size:clamp(20px,5.6vw,24px);line-height:1.2}
.ar{flex:none;width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.foot{margin-top:auto;padding-top:clamp(56px,9svh,110px);text-align:center}
.fl{display:flex;align-items:center;gap:14px}
.fl i{flex:1;height:1px;background:var(--line)}
.fl svg{width:22px;height:22px;fill:var(--ink)}
.foot p{margin:14px 0 0;font-style:italic;letter-spacing:.08em;font-size:clamp(16px,4.5vw,19px)}
#editor{max-width:480px;margin:0 auto;padding:28px 22px 56px;font-size:17px}
#editor:empty{display:none}
#editor h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:30px;margin:0 0 4px}
#editor p{margin:0 0 18px;font-size:15px;color:#5b5a4b}
.box{padding:16px;margin-bottom:14px;background:rgba(255,250,240,.5);border:1px solid var(--line);border-radius:10px}
label{display:block;margin:0 0 10px;font-size:15px;color:#5b5a4b}
input,select,textarea{display:block;width:100%;margin-top:3px;padding:9px 10px;font:inherit;font-size:16px;color:var(--ink);background:#FAF3E6;border:1px solid var(--line);border-radius:6px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:16px;padding:8px 14px;color:var(--ink);background:#FAF3E6;border:1px solid var(--line);border-radius:6px;cursor:pointer}
button.main{background:var(--ink);border-color:var(--ink);color:#F5E9D6}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
textarea{height:140px;font-family:monospace;font-size:13px;margin-top:10px}
details{margin-top:14px}summary{cursor:pointer}
@media (prefers-reduced-motion:reduce){.card{transition:none}}

<script>
var ICONS={
  linkedin:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="5"/><g transform="translate(3.6 3.6) scale(.7)" fill="#EEDBC5"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></g></svg>',
  email:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1.5" y="4.5" width="21" height="15" rx="1.5"/><path d="M2 5.5l10 8 10-8M2.5 18.5l7.5-6M21.5 18.5l-7.5-6" fill="none" stroke="#EEDBC5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  instagram:'<svg class="st" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6"/></svg>',
  whatsapp:'<svg class="st" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.3-4.2A8 8 0 1 1 8.2 18.8z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8c-.8-.4-1.6-1.2-2-2l.8-1-1-2z"/></svg>',
  website:'<svg class="st" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>'
};
var LABELS={linkedin:'LinkedIn',email:'Email',instagram:'Instagram',whatsapp:'WhatsApp',website:'Website'};
var STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14.6 9.4 L24 12 L14.6 14.6 L12 24 L9.4 14.6 L0 12 L9.4 9.4Z"/></svg>';
var ARROW='<svg class="ar" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 15L15 5M7 5h8v8"/></svg>';
var editing=location.hash==='#edit';
var D=JSON.parse(document.getElementById('data').textContent);
if(editing){try{var s=localStorage.getItem('links-draft-2');if(s)D=JSON.parse(s);}catch(e){}}

function h(tag,attrs,kids){var e=document.createElement(tag);for(var k in (attrs||{})){e.setAttribute(k,attrs[k]);}(kids||[]).forEach(function(c){e.appendChild(typeof c==='string'?document.createTextNode(c):c);});return e;}
function safeUrl(u){u=(u||'').trim();if(/^(https?:\/\/|mailto:|tel:)/i.test(u))return u;if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(u))return 'mailto:'+u;if(/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(u))return 'https://'+u;return '';}
function save(){if(!editing)return;try{localStorage.setItem('links-draft-2',JSON.stringify(D));}catch(e){}}
function html(el,s){el.insertAdjacentHTML('beforeend',s);}

function renderPage(){
  var app=document.getElementById('app');app.innerHTML='';
  document.title=D.name||'Links';
  var head=h('div',{'class':'head'},[h('h1',{},[D.name||'']),h('p',{'class':'tag'},[D.tagline||''])]);
  app.appendChild(head);
  app.appendChild(h('div',{'class':'rule'}));
  var cards=h('nav',{'class':'cards','aria-label':'Links'});
  D.links.forEach(function(l){
    var href=safeUrl(l.url);
    if(!href&&!editing)return;
    var a=h('a',{'class':'card',href:href||'#',target:'_blank',rel:'noopener noreferrer'});
    var ic=h('span',{'class':'ic'});html(ic,ICONS[l.icon]||ICONS.website);
    a.appendChild(ic);a.appendChild(h('span',{'class':'dv'}));
    a.appendChild(h('span',{'class':'t'},[l.title||'']));
    html(a,ARROW);cards.appendChild(a);
  });
  app.appendChild(cards);
  var foot=h('div',{'class':'foot'});
  var fl=h('div',{'class':'fl'},[h('i'),h('i')]);
  fl.insertBefore(document.createRange().createContextualFragment(STAR),fl.lastChild);
  foot.appendChild(fl);foot.appendChild(h('p',{},[D.footer||'']));
  app.appendChild(foot);
}

function field(label,val,onch,extra){
  var i=h('input',{type:'text',value:val||''});if(extra)for(var k in extra)i.setAttribute(k,extra[k]);
  i.addEventListener('input',function(){onch(i.value);save();renderPage();});
  return h('label',{},[label,i]);
}
function pageSource(){
  var c=document.documentElement.cloneNode(true);
  c.querySelector('#data').textContent='\n'+JSON.stringify(D,null,2)+'\n';
  c.querySelector('#app').innerHTML='';c.querySelector('#editor').innerHTML='';
  return '<!DOCTYPE html>\n'+c.outerHTML;
}
function buildEditor(){
  var ed=document.getElementById('editor');ed.innerHTML='';
  if(!editing)return;
  ed.appendChild(h('h2',{},['Edit this page']));
  ed.appendChild(h('p',{},['Changes show above right away and stay in this browser. A card with an empty link stays hidden for visitors. To publish, copy the page code at the bottom.']));
  var top=h('div',{'class':'box'});
  top.appendChild(field('Name',D.name,function(v){D.name=v;}));
  top.appendChild(field('Line under name',D.tagline,function(v){D.tagline=v;}));
  top.appendChild(field('Closing line',D.footer,function(v){D.footer=v;}));
  ed.appendChild(top);
  D.links.forEach(function(l,i){
    var b=h('div',{'class':'box'});
    var sel=h('select',{});
    Object.keys(LABELS).forEach(function(k){var o=h('option',{value:k},[LABELS[k]]);if(k===l.icon)o.selected=true;sel.appendChild(o);});
    sel.addEventListener('change',function(){l.icon=sel.value;save();renderPage();});
    b.appendChild(h('label',{},['Icon',sel]));
    b.appendChild(field('Title',l.title,function(v){l.title=v;}));
    b.appendChild(field('Link or email',l.url,function(v){l.url=v;},{inputmode:'url',autocapitalize:'off'}));
    var r=h('div',{'class':'row'});
    [['Move up',-1],['Move down',1]].forEach(function(m){
      var bt=h('button',{type:'button'},[m[0]]);
      bt.addEventListener('click',function(){var j=i+m[1];if(j<0||j>=D.links.length)return;var t=D.links[i];D.links[i]=D.links[j];D.links[j]=t;save();renderPage();buildEditor();});
      r.appendChild(bt);
    });
    var del=h('button',{type:'button'},['Remove']);
    del.addEventListener('click',function(){D.links.splice(i,1);save();renderPage();buildEditor();});
    r.appendChild(del);b.appendChild(r);ed.appendChild(b);
  });
  var add=h('button',{type:'button','class':'main'},['Add a link']);
  add.addEventListener('click',function(){D.links.push({icon:'website',title:'New link',url:''});save();renderPage();buildEditor();});
  ed.appendChild(add);
  var det=h('details',{open:''},[h('summary',{},['Page code'])]);
  var box=h('textarea',{readonly:'',spellcheck:'false','aria-label':'Page code'});
  var row=h('div',{'class':'row',style:'margin-top:10px'});
  var cp=h('button',{type:'button'},['Copy page code']);
  cp.addEventListener('click',function(){box.value=pageSource();box.focus();box.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}cp.textContent=ok?'Copied':'Select and copy manually';});
  var rs=h('button',{type:'button'},['Discard my edits']);
  rs.addEventListener('click',function(){try{localStorage.removeItem('links-draft-2');}catch(e){}location.reload();});
  row.appendChild(cp);row.appendChild(rs);det.appendChild(row);det.appendChild(box);ed.appendChild(det);
}
window.addEventListener('hashchange',function(){location.reload();});
renderPage();buildEditor();
</script>
</body>
</html>

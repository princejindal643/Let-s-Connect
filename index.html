<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prince Agarwal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EDE0; --card:#FAF6EC; --ink:#22281F; --muted:#6B6B5C; --line:#D9D0BC; --accent:#2F4A3A;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1B1D18;--card:#24271F;--ink:#EFE8D6;--muted:#A39F8C;--line:#3A3D31;--accent:#A9C4AF;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#1B1D18;--card:#24271F;--ink:#EFE8D6;--muted:#A39F8C;--line:#3A3D31;--accent:#A9C4AF;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"EB Garamond",Garamond,Georgia,"Times New Roman",serif;font-size:19px;line-height:1.6;display:flex;flex-direction:column;align-items:center;padding:56px 22px 48px}
main,#editor{width:100%;max-width:420px}
main{text-align:center}
.mono{width:104px;height:104px;margin:0 auto 26px;border-radius:50%;border:1px solid var(--accent);display:grid;place-items:center;box-shadow:0 0 0 6px var(--bg),0 0 0 7px var(--line);font-family:"Cormorant Garamond",Garamond,Georgia,serif;font-weight:600;font-size:44px;letter-spacing:.04em;color:var(--accent);padding-left:.04em}
h1{margin:0;font-family:"Cormorant Garamond",Garamond,Georgia,serif;font-weight:500;font-size:44px;line-height:1.1;letter-spacing:.01em}
.sub{display:flex;align-items:center;gap:14px;margin:22px auto 40px;max-width:300px;color:var(--muted);font-style:italic;font-size:18px;letter-spacing:.03em}
.sub::before,.sub::after{content:"";flex:1;height:1px;background:var(--line)}
.links{display:flex;flex-direction:column;gap:14px;text-align:left}
.card{display:flex;align-items:center;gap:16px;padding:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:4px;color:inherit;text-decoration:none;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card svg{flex:none;width:26px;height:26px;fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.card svg.fill{fill:var(--accent);stroke:none}
.card b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:23px;line-height:1.2}
.card span{display:block;color:var(--muted);font-size:16px}
#editor{margin-top:56px;padding-top:28px;border-top:1px solid var(--line);font-size:17px}
#editor:empty{display:none}
#editor h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:28px;margin:0 0 4px}
#editor p{margin:0 0 18px;color:var(--muted);font-size:16px}
.box{padding:16px;margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:4px}
label{display:block;margin:0 0 10px;font-size:15px;color:var(--muted)}
input,select,textarea{display:block;width:100%;margin-top:3px;padding:9px 10px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:16px;padding:8px 14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:3px;cursor:pointer}
button.main{background:var(--accent);border-color:var(--accent);color:var(--bg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{height:140px;font-family:monospace;font-size:13px}
details{margin-top:14px}
summary{cursor:pointer}
@media (prefers-reduced-motion: reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<main id="app"></main>
<section id="editor"></section>

<script id="data" type="application/json">
{
  "name": "Prince Agarwal",
  "monogram": "PA",
  "tagline": "More ways to connect",
  "links": [
    { "icon": "linkedin", "title": "LinkedIn", "sub": "Connect with me", "url": "https://www.linkedin.com/in/prince-agarwal-1918412b5" }
  ]
}
</script>

<script>
var ICONS={
  linkedin:'<svg class="fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>',
  instagram:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6"/></svg>',
  whatsapp:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.3-4.2A8 8 0 1 1 8.2 18.8z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8c-.8-.4-1.6-1.2-2-2l.8-1-1-2z"/></svg>',
  email:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg>',
  website:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>'
};
var LABELS={linkedin:'LinkedIn',instagram:'Instagram',whatsapp:'WhatsApp',email:'Email',website:'Website'};
var editing=location.hash==='#edit';
var D=JSON.parse(document.getElementById('data').textContent);
if(editing){try{var s=localStorage.getItem('links-draft');if(s)D=JSON.parse(s);}catch(e){}}

function h(tag,attrs,kids){var e=document.createElement(tag);for(var k in (attrs||{})){e.setAttribute(k,attrs[k]);}(kids||[]).forEach(function(c){e.appendChild(typeof c==='string'?document.createTextNode(c):c);});return e;}
function safeUrl(u){u=(u||'').trim();if(/^(https?:\/\/|mailto:|tel:)/i.test(u))return u;if(/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(u))return 'https://'+u;return '#';}
function save(){if(!editing)return;try{localStorage.setItem('links-draft',JSON.stringify(D));}catch(e){}}

function renderPage(){
  var app=document.getElementById('app');app.innerHTML='';
  document.title=D.name||'Links';
  app.appendChild(h('div',{'class':'mono','aria-hidden':'true'},[D.monogram||'']));
  app.appendChild(h('h1',{},[D.name||'']));
  app.appendChild(h('p',{'class':'sub'},[D.tagline||'']));
  var nav=h('nav',{'class':'links','aria-label':'Links'});
  D.links.forEach(function(l){
    var a=h('a',{'class':'card',href:safeUrl(l.url),target:'_blank',rel:'noopener noreferrer'});
    var ic=document.createElement('span');ic.style.cssText='display:contents';ic.innerHTML=ICONS[l.icon]||ICONS.website;
    a.appendChild(ic.firstChild);
    var box=h('div',{},[h('b',{},[l.title||'']),h('span',{},[l.sub||''])]);
    a.appendChild(box);nav.appendChild(a);
  });
  app.appendChild(nav);
}

function field(label,val,onch,extra){
  var i=h('input',{type:'text',value:val||''});if(extra)for(var k in extra)i.setAttribute(k,extra[k]);
  i.addEventListener('input',function(){onch(i.value);save();renderPage();updateCode();});
  return h('label',{},[label,i]);
}
var codeBox;
function pageSource(){
  var c=document.documentElement.cloneNode(true);
  c.querySelector('#data').textContent='\n'+JSON.stringify(D,null,2)+'\n';
  c.querySelector('#app').innerHTML='';c.querySelector('#editor').innerHTML='';
  return '<!DOCTYPE html>\n'+c.outerHTML;
}
function updateCode(){if(codeBox)codeBox.value=pageSource();}

function buildEditor(){
  var ed=document.getElementById('editor');ed.innerHTML='';
  if(!editing)return;
  ed.appendChild(h('h2',{},['Edit this page']));
  ed.appendChild(h('p',{},['Changes show above right away and stay in this browser. To publish them, copy the page code at the bottom.']));
  var top=h('div',{'class':'box'});
  top.appendChild(field('Name',D.name,function(v){D.name=v;}));
  top.appendChild(field('Monogram',D.monogram,function(v){D.monogram=v;},{maxlength:'3'}));
  top.appendChild(field('Tagline',D.tagline,function(v){D.tagline=v;}));
  ed.appendChild(top);
  D.links.forEach(function(l,i){
    var b=h('div',{'class':'box'});
    var sel=h('select',{});
    Object.keys(LABELS).forEach(function(k){var o=h('option',{value:k},[LABELS[k]]);if(k===l.icon)o.selected=true;sel.appendChild(o);});
    sel.addEventListener('change',function(){l.icon=sel.value;save();renderPage();updateCode();});
    b.appendChild(h('label',{},['Icon',sel]));
    b.appendChild(field('Title',l.title,function(v){l.title=v;}));
    b.appendChild(field('Small text',l.sub,function(v){l.sub=v;}));
    b.appendChild(field('Link',l.url,function(v){l.url=v;},{inputmode:'url',autocapitalize:'off'}));
    var r=h('div',{'class':'row'});
    [['Move up',-1],['Move down',1]].forEach(function(m){
      var bt=h('button',{type:'button'},[m[0]]);
      bt.addEventListener('click',function(){var j=i+m[1];if(j<0||j>=D.links.length)return;var t=D.links[i];D.links[i]=D.links[j];D.links[j]=t;save();renderPage();buildEditor();});
      r.appendChild(bt);
    });
    var del=h('button',{type:'button'},['Remove']);
    del.addEventListener('click',function(){D.links.splice(i,1);save();renderPage();buildEditor();});
    r.appendChild(del);b.appendChild(r);ed.appendChild(b);
  });
  var add=h('button',{type:'button','class':'main'},['Add a link']);
  add.addEventListener('click',function(){D.links.push({icon:'website',title:'New link',sub:'',url:''});save();renderPage();buildEditor();});
  ed.appendChild(add);
  var det=h('details',{open:''},[h('summary',{},['Page code'])]);
  det.appendChild(h('p',{},['Copy all of this and send it to Claude to publish, or save it as index.html and upload it to Netlify Drop.']));
  codeBox=h('textarea',{readonly:'',spellcheck:'false','aria-label':'Page code'});
  det.appendChild(codeBox);
  var row=h('div',{'class':'row',style:'margin-top:10px'});
  var cp=h('button',{type:'button'},['Copy page code']);
  cp.addEventListener('click',function(){updateCode();codeBox.focus();codeBox.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}cp.textContent=ok?'Copied':'Select and copy manually';});
  var rs=h('button',{type:'button'},['Discard my edits']);
  rs.addEventListener('click',function(){try{localStorage.removeItem('links-draft');}catch(e){}location.reload();});
  row.appendChild(cp);row.appendChild(rs);det.appendChild(row);ed.appendChild(det);
  updateCode();
}
window.addEventListener('hashchange',function(){location.reload();});
renderPage();buildEditor();
</script>
</body>
</html>
